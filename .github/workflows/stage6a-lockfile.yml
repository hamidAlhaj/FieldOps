name: Stage 6A dependency lockfile
on:
  push:
    branches:
      - feature/stage-6a-tracking-backend
    paths:
      - apps/web/package.json
  workflow_dispatch:
permissions:
  contents: write
jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Update npm lockfile
        run: npm install --package-lock-only --no-audit --no-fund
      - name: Commit consistent lockfile to the feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(tracking): synchronize Leaflet npm lockfile"
            git push origin HEAD:feature/stage-6a-tracking-backend
          fi
