name: Stage 6A Tracking Backend

on:
  push:
    branches:
      - feature/stage-6a-tracking-backend
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tracking-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fieldops
          POSTGRES_PASSWORD: local-development-only
          POSTGRES_DB: fieldops_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fieldops -d fieldops_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://fieldops:local-development-only@localhost:5432/fieldops_test?schema=public
      TEST_DATABASE_URL: postgresql://fieldops:local-development-only@localhost:5432/fieldops_test?schema=public
      JWT_ACCESS_SECRET: integration-only-tracking-backend-verification-key-2026-abcdefghijklmnopqrstuvwxyz-0123456789
      WEB_ORIGIN: http://localhost:5173
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npm run db:generate
      - name: Validate Prisma schema
        run: npx --no-install prisma validate --schema apps/api/prisma/schema.prisma
      - name: TypeScript verification
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Jest unit tests
        run: npm test
      - name: PostgreSQL-backed integration tests
        run: npm run test:integration -w @fieldops/api
      - name: Install Chromium for real browser integration
        run: npx --no-install playwright install chromium
      - name: Playwright connected-browser integration
        run: npm run test:e2e:api -w @fieldops/web
